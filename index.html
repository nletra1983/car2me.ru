<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Car2Me — подбор и доставка автомобилей из Кореи">
  <title>Car2Me — авто из Кореи</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1419;
      --text: #f5f7fa;
      --muted: #9aa4b2;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      padding: 2rem;
    }
    main {
      max-width: 36rem;
      text-align: center;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      margin: 0 0 0.75rem;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.4rem 0.75rem;
      border: 1px solid #334155;
      border-radius: 999px;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Car2Me</h1>
    <p>Подбор и доставка автомобилей из Кореи.<br>Сайт в разработке.</p>
    <div class="badge">car2me.ru</div>
  </main>
</body>
</html>
